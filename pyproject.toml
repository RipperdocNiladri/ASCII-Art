[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "terminal-ascii-art"
version = "0.1.0"
description = "Image, video, and procedural 3D ASCII renderers for the terminal"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "Pillow>=10.0",
]

[project.scripts]
ascii-art = "ascii_art.cli:main"

[tool.setuptools.packages.find]
include = ["ascii_art*"]
